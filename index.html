<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12664f"><meta name="description" content="Tra cứu nhanh tên công ty, mã số thuế và địa chỉ dành cho tài xế.">
<title>Tra cứu MST công ty</title>
<style>
:root{--green:#12664f;--green2:#0d513e;--bg:#f3f6f5;--ink:#182522;--muted:#66736f;--line:#dce5e1;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}.top{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:24px 16px 28px}.wrap{max-width:850px;margin:auto}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}.top h1{font-size:clamp(24px,5vw,34px);line-height:1.15;margin:8px 0}.top p{margin:0;opacity:.9;font-size:14px}.main{max-width:850px;margin:-12px auto 40px;padding:0 12px}.searchbox{background:#fff;padding:14px;border-radius:16px;box-shadow:0 8px 24px #15382d12}.searchbox label{display:block;font-weight:700;font-size:14px;margin:0 0 8px}.searchrow{display:flex;gap:8px}input{width:100%;min-width:0;border:2px solid var(--line);border-radius:12px;padding:14px 13px;font:inherit;font-size:16px;outline:none}input:focus{border-color:var(--green)}button{border:0;border-radius:11px;padding:12px 14px;font:inherit;font-weight:700;cursor:pointer;min-height:44px}.searchbtn{background:var(--green);color:#fff}.clearbtn{background:#edf2f0;color:#263a33}.tip{color:var(--muted);font-size:12px;margin:9px 2px 0}.summary{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:18px 3px 10px;font-size:13px;color:var(--muted)}.results{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.company{font-size:17px;line-height:1.35;font-weight:800;margin:0 0 12px}.updated{font-size:12px;color:var(--muted);margin:-5px 0 12px}.pill{display:inline-block;background:#e7f4ee;color:#145c46;border-radius:7px;padding:5px 8px;font-size:12px;font-weight:800;margin-bottom:10px}.field{margin-top:9px}.label{display:block;font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:3px}.value{font-size:15px;line-height:1.45;overflow-wrap:anywhere}.mstrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.mst{font-size:20px;font-weight:850;letter-spacing:.02em}.copy{background:#e8f3ee;color:#145c46;white-space:nowrap;font-size:13px;padding:9px 11px;min-height:40px}.copy:active,.searchbtn:active{transform:scale(.98)}.empty{background:#fff;border:1px dashed #b9c8c1;border-radius:14px;padding:28px 16px;text-align:center;color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 8px}.loading{padding:24px;text-align:center;color:var(--muted)}@media(min-width:650px){.main{padding:0 18px}.results{grid-template-columns:1fr 1fr}.card{padding:17px}.searchbox{padding:18px}.top{padding-top:30px}}@media(max-width:390px){.searchrow{flex-wrap:wrap}.searchbtn{flex:1}.clearbtn{flex:0 0 auto}.mstrow{align-items:flex-start;flex-direction:column}.copy{width:100%}}
</style></head>
<body><header class="top"><div class="wrap"><div class="eyebrow">Dành cho tài xế</div><h1>Tra cứu MST công ty</h1><p>Tìm nhanh tên công ty · Mã số thuế · Tên viết tắt</p></div></header>
<main class="main"><section class="searchbox"><label for="q">Bạn cần tìm công ty nào?</label><div class="searchrow"><input id="q" type="search" placeholder="Ví dụ: KUO YUEN, 3900804993..." autocomplete="off"><button class="searchbtn" id="search">Tìm kiếm</button><button class="clearbtn" id="clear">Xóa</button></div><p class="tip">Nhập một phần tên, MST hoặc tên viết tắt. Không cần gõ dấu tiếng Việt.</p></section>
<div class="summary"><span id="count">Đang tải dữ liệu…</span><span id="status"></span></div><section id="results" class="results"><div class="loading">Đang tải danh sách công ty…</div></section>
<footer class="footer">Thông tin dùng để tra cứu nội bộ. Vui lòng xác nhận thông tin khi có sai lệch.</footer></main>
<script>
let companies=[];const q=document.getElementById('q'),results=document.getElementById('results'),count=document.getElementById('count'),status=document.getElementById('status');
function norm(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]/g,'')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function copyText(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(String(text)).then(()=>{status.textContent='Đã sao chép';setTimeout(()=>status.textContent='',1800)}).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){const t=document.createElement('textarea');t.value=String(text);document.body.appendChild(t);t.select();try{document.execCommand('copy');status.textContent='Đã sao chép';setTimeout(()=>status.textContent='',1800)}catch(e){status.textContent='Không sao chép được'}t.remove()}
function render(){const term=norm(q.value.trim());let found=companies.filter(c=>!term||[c.name,c.mst,c.short,c.address,c.note].some(v=>norm(v).includes(term)));count.textContent=`Hiển thị ${found.length} / ${companies.length} công ty`;if(!found.length){results.innerHTML='<div class="empty"><strong>Chưa tìm thấy công ty</strong><br><br>Thử nhập ít ký tự hơn hoặc tìm bằng MST/tên viết tắt.</div>';return}results.innerHTML=found.map(c=>`<article class="card"><div class="pill">${esc(c.short||'CÔNG TY')}</div><h2 class="company">${esc(c.name||'Chưa có tên công ty')}</h2>${c.updatedAt?`<div class="updated">Ngày cập nhật: ${esc(c.updatedAt)}</div>`:''}<div class="field"><span class="label">Mã số thuế</span><div class="mstrow"><span class="mst">${esc(c.mst||'Chưa có MST')}</span>${c.mst?`<button class="copy" data-copy="${esc(c.mst)}">Sao chép MST</button>`:''}</div></div><div class="field"><span class="label">Địa chỉ</span><div class="value">${esc(c.address||'Chưa có địa chỉ')}</div>${c.address?`<button class="copy" style="margin-top:7px" data-copy="${esc(c.address)}">Sao chép địa chỉ</button>`:''}</div>${c.note?`<div class="field"><span class="label">Ghi chú</span><div class="value">${esc(c.note)}</div></div>`:''}</article>`).join('');results.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>copyText(b.getAttribute('data-copy'))))}
async function load(){try{const r=await fetch('./data.json',{cache:'no-store'});if(!r.ok)throw new Error('Không đọc được data.json');companies=await r.json();render()}catch(e){count.textContent='Chưa tải được dữ liệu';results.innerHTML='<div class="empty"><strong>Không tải được danh sách công ty.</strong><br><br>Quản lý cần kiểm tra đã tải file <code>data.json</code> cùng thư mục với trang web chưa.</div>'}}
document.getElementById('search').addEventListener('click',render);document.getElementById('clear').addEventListener('click',()=>{q.value='';render();q.focus()});q.addEventListener('input',render);load();
</script></body></html>
